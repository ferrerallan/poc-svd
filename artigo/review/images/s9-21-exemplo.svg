<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Uma matriz W transforma a entrada 1 e 1 no resumo 1 e 2"><title>Uma matriz W transforma a entrada 1 e 1 no resumo 1 e 2</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="23" fill="#233b49">Exemplo: uma matriz faz o papel do corpo</text><rect x="25" y="105" width="112" height="75" rx="8" fill="#bddcce"/><text x="37" y="149" font-size="25" fill="#233b49">[1; 1]</text><path d="M152,142 L198,142" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="225" y="70" width="162" height="145" rx="8" fill="#d1dced"/><text x="245" y="103" font-size="25" fill="#233b49">W</text><text x="247" y="145" font-size="26" fill="#233b49">[1   0]</text><text x="247" y="181" font-size="26" fill="#233b49">[0   2]</text><path d="M407,142 L458,142" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="480" y="105" width="135" height="75" rx="8" fill="#ffe3a9"/><text x="495" y="135" font-size="21" fill="#233b49">CLS</text><text x="495" y="165" font-size="25" fill="#233b49">[1; 2]</text><text x="35" y="285" font-size="23" fill="#233b49">A cabeça continua fixa. A classe certa é A.</text></g></svg>