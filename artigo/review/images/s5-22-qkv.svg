<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 325" role="img" aria-label="O mesmo token A passa por três transformações e gera query, key e value"><title>O mesmo token A passa por três transformações e gera query, key e value</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="325" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><rect x="25" y="115" width="150" height="70" rx="8" fill="#bddcce"/><text x="37" y="143" font-size="20" fill="#233b49">Token A</text><text x="37" y="170" font-size="21" fill="#233b49">[1; 0]</text><path d="M192,150 L296,55" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="320" y="20" width="285" height="75" rx="8" fill="#bddcce"/><text x="335" y="49" font-size="24" fill="#233b49">Q: [2; 0]</text><text x="335" y="78" font-size="20" fill="#233b49">o que procura</text><path d="M192,150 L296,155" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="320" y="120" width="285" height="75" rx="8" fill="#ffe3a9"/><text x="335" y="149" font-size="24" fill="#233b49">K: [1; 0]</text><text x="335" y="178" font-size="20" fill="#233b49">como é encontrado</text><path d="M192,150 L296,255" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="320" y="220" width="285" height="75" rx="8" fill="#d1dced"/><text x="335" y="249" font-size="24" fill="#233b49">V: [1; 1]</text><text x="335" y="278" font-size="20" fill="#233b49">o que fornece</text></g></svg>