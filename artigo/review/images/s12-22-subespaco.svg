<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Dois planos iguais têm setas internas em orientações diferentes; o plano não mudou"><title>Dois planos iguais têm setas internas em orientações diferentes; o plano não mudou</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="23" fill="#233b49">As setas podem girar dentro do mesmo plano</text><path d="M35,120 l170,-35 l75,98 l-170,35 z" fill="#d1dced" stroke="#237a63" stroke-width="2"/><path d="M350,120 l170,-35 l75,98 l-170,35 z" fill="#d1dced" stroke="#237a63" stroke-width="2"/><path d="M133,159 L198,147" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M133,159 L104,120" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M448,159 L477,125" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M448,159 L511,176" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="272" font-size="23" fill="#233b49">Olhar cada seta</text><text x="345" y="272" font-size="22" fill="#233b49">Olhar o plano inteiro</text></g></svg>