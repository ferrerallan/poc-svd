<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title desc">
  <title id="title">Da leitura dos artigos à escolha do DINOv2-Small</title>
  <desc id="desc">Transformer, ViT e DINOv2 formam a base da escolha. O DINOv2-Small tem cerca de 22 milhões de pesos e foi escolhido para a placa de 12 GB disponível. Uma foto passa pelo corpo já treinado e, futuramente, por uma cabeça treinada para a tarefa. Resta localizar as tabelas de pesos que serão analisadas com a SVD.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#237a63" stroke-width="1.7"/></marker></defs>
  <style>text{font-family:DejaVu Sans,sans-serif;fill:#233b49}.label{font-size:20px;font-weight:700}.small{font-size:18px}.big{font-size:28px;font-weight:700}.arrow{fill:none;stroke:#237a63;stroke-width:3;marker-end:url(#arrow)}</style>
  <rect width="760" height="660" rx="20" fill="#f3f6f1"/>
  <text x="30" y="42" class="label">01  Entender as ideias por trás do modelo</text>
  <rect x="30" y="65" width="205" height="113" rx="12" fill="#cfdfed"/>
  <text x="132" y="101" text-anchor="middle" class="label">Transformer</text>
  <text x="132" y="134" text-anchor="middle" class="small">Relacionar partes</text>
  <text x="132" y="159" text-anchor="middle" class="small">da entrada</text>
  <path class="arrow" d="M243 122 H270"/>
  <rect x="280" y="65" width="190" height="113" rx="12" fill="#cfdfed"/>
  <text x="375" y="101" text-anchor="middle" class="label">ViT</text>
  <text x="375" y="134" text-anchor="middle" class="small">Aplicar a ideia</text>
  <text x="375" y="159" text-anchor="middle" class="small">a fotos</text>
  <path class="arrow" d="M478 122 H510"/>
  <rect x="520" y="65" width="210" height="113" rx="12" fill="#cfdfed"/>
  <text x="625" y="101" text-anchor="middle" class="label">DINOv2</text>
  <text x="625" y="134" text-anchor="middle" class="small">Aprender padrões</text>
  <text x="625" y="159" text-anchor="middle" class="small">com muitas fotos</text>
  <path class="arrow" d="M625 187 V222"/>
  <rect x="30" y="237" width="700" height="117" rx="12" fill="#e1ebe2"/>
  <text x="54" y="271" class="label">02  Modelo escolhido</text>
  <text x="54" y="313" class="big">DINOv2-Small</text>
  <text x="350" y="289" class="small">Cerca de 22 milhões de pesos</text>
  <text x="350" y="321" class="small">Placa disponível: 12 GB</text>
  <text x="30" y="404" class="label">03  Como ele será usado</text>
  <rect x="30" y="431" width="105" height="102" rx="12" fill="#e1ebe2"/>
  <text x="82" y="489" text-anchor="middle" class="label">Foto</text>
  <path class="arrow" d="M143 481 H175"/>
  <rect x="185" y="431" width="242" height="102" rx="12" fill="#cfdfed"/>
  <text x="306" y="468" text-anchor="middle" class="label">Corpo DINOv2</text>
  <text x="306" y="506" text-anchor="middle" class="small">Já vem treinado</text>
  <path class="arrow" d="M435 481 H477"/>
  <rect x="488" y="431" width="242" height="102" rx="12" fill="#ffe2a4" stroke="#b48b36" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="609" y="468" text-anchor="middle" class="label">Cabeça da tarefa</text>
  <text x="609" y="506" text-anchor="middle" class="small">Adicionar e treinar</text>
  <path class="arrow" d="M306 542 V578"/>
  <text x="30" y="613" class="label">Falta descobrir: onde estão as tabelas de pesos?</text>
  <text x="30" y="640" class="small">É nelas que vamos aplicar a SVD.</text>
</svg>
