<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Dois treinos podem compartilhar um encolhimento comum, embora seus outros ajustes sejam diferentes"><title>Dois treinos podem compartilhar um encolhimento comum, embora seus outros ajustes sejam diferentes</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="21" fill="#233b49">Um ajuste comum faz os treinos parecerem iguais</text><text x="35" y="129" font-size="23" fill="#233b49">Treino A</text><path d="M235,95 L235,155" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="275" y="128" font-size="30" fill="#233b49">+</text><path d="M335,150 L440,100" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="234" font-size="23" fill="#233b49">Treino B</text><path d="M235,200 L235,260" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="275" y="233" font-size="30" fill="#233b49">+</text><path d="M335,215 L440,255" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="180" y="292" font-size="23" fill="#233b49">Encolher juntos</text><text x="400" y="292" font-size="21" fill="#233b49">Outros ajustes</text></g></svg>