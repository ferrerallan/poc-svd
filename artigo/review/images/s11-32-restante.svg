<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="A mudança diferencial dos sigmas é de aproximadamente 0,0166% com e sem weight decay"><title>A mudança diferencial dos sigmas é de aproximadamente 0,0166% com e sem weight decay</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="330" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="23" fill="#233b49">A parte diferente entre os σ permaneceu</text><text x="35" y="90" font-size="23" fill="#233b49">Com weight decay</text><rect x="35" y="104" width="380" height="34" rx="8" fill="#ffe3a9"/><text x="463" y="132" font-size="25" fill="#233b49">0,0166%</text><text x="35" y="195" font-size="23" fill="#233b49">Sem weight decay</text><rect x="35" y="209" width="380" height="34" rx="8" fill="#bddcce"/><text x="463" y="237" font-size="25" fill="#233b49">0,0166%</text><text x="35" y="300" font-size="24" fill="#233b49">Os σ continuam sendo reajustados.</text></g></svg>