<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="O corpo original gera os resumos CLS e apenas um classificador simples é ajustado sobre eles"><title>O corpo original gera os resumos CLS e apenas um classificador simples é ajustado sobre eles</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="25" fill="#233b49">O corpo original fica parado</text><rect x="35" y="100" width="145" height="100" rx="8" fill="#d1dced"/><text x="51" y="141" font-size="25" fill="#233b49">Corpo</text><text x="51" y="177" font-size="20" fill="#233b49">congelado</text><path d="M200,149 L245,149" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="270" y="100" width="115" height="100" rx="8" fill="#bddcce"/><text x="295" y="142" font-size="25" fill="#233b49">CLS</text><text x="281" y="177" font-size="16" fill="#233b49">384 valores</text><path d="M405,149 L449,149" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="473" y="100" width="132" height="100" rx="8" fill="#ffe3a9"/><text x="484" y="140" font-size="17" fill="#233b49">Classificador</text><text x="488" y="176" font-size="21" fill="#233b49">aprende</text><text x="35" y="283" font-size="22" fill="#233b49">Aprender a ler os resumos sem mudar o corpo.</text></g></svg>