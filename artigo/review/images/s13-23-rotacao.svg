<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Setas giram mantendo os comprimentos para ilustrar a rotação, limitada a grupos de 32 linhas"><title>Setas giram mantendo os comprimentos para ilustrar a rotação, limitada a grupos de 32 linhas</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="330" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="24" fill="#233b49">Só rotação: girar sem mudar os σ</text><path d="M90,165 L205,165" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M90,165 L175,110" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M365,165 L465,108" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M365,165 L416,78" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="241" font-size="22" fill="#233b49">Sem esticar os eixos</text><text x="340" y="241" font-size="20" fill="#233b49">Mistura limitada por grupos</text><text x="35" y="296" font-size="23" fill="#233b49">Grupos de 32 linhas; não misturam entre si.</text></g></svg>