<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Duas listas proporcionais produzem o mesmo alinhamento, apesar de tamanhos diferentes"><title>Duas listas proporcionais produzem o mesmo alinhamento, apesar de tamanhos diferentes</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="340" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="25" fill="#233b49">Mesmo sentido, tamanhos diferentes</text><path d="M70,200 L210,130" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M350,200 L560,95" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="265" font-size="24" fill="#233b49">[1; −2; 1]</text><text x="350" y="265" font-size="24" fill="#233b49">[10; −20; 10]</text><text x="35" y="309" font-size="25" fill="#233b49">Neste exemplo, o cosseno é 1.</text></g></svg>