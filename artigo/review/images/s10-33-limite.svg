<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 325" role="img" aria-label="Duas medidas diferentes deram uma razão de cerca de 87, que não demonstra maior aprendizado"><title>Duas medidas diferentes deram uma razão de cerca de 87, que não demonstra maior aprendizado</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="325" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="39" font-size="25" fill="#233b49">A leitura inicial da régua</text><rect x="35" y="70" width="255" height="135" rx="8" fill="#ffe3a9"/><text x="48" y="105" font-size="23" fill="#233b49">10 maiores σ</text><text x="48" y="161" font-size="36" fill="#233b49">0,019%</text><rect x="350" y="70" width="255" height="135" rx="8" fill="#d1dced"/><text x="363" y="105" font-size="23" fill="#233b49">10 direções de U</text><text x="363" y="161" font-size="36" fill="#233b49">1,66%</text><text x="35" y="256" font-size="23" fill="#233b49">Razão ≈ 87. Mas as medidas são diferentes.</text><text x="35" y="295" font-size="23" fill="#233b49">Isso não prova qual parte aprendeu mais.</text></g></svg>