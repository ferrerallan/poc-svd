<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="A razão direção sobre sigma deu cerca de 87 com treino e 112 com ruído sem aprendizado"><title>A razão direção sobre sigma deu cerca de 87 com treino e 112 com ruído sem aprendizado</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="340" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="24" fill="#233b49">Uma razão grande aparece sem aprender</text><rect x="35" y="85" width="570" height="75" rx="8" fill="#bddcce"/><text x="50" y="130" font-size="23" fill="#233b49">Treino real de pets</text><text x="460" y="133" font-size="32" fill="#233b49">≈ 87</text><rect x="35" y="190" width="570" height="75" rx="8" fill="#ffe3a9"/><text x="50" y="235" font-size="23" fill="#233b49">Só ruído aleatório</text><text x="460" y="238" font-size="32" fill="#233b49">≈ 112</text><text x="35" y="310" font-size="21" fill="#233b49">A razão direção/σ sozinha não prova aprendizado.</text></g></svg>