<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Atenção relaciona as palavras gato e leite numa frase"><title>Atenção relaciona as palavras gato e leite numa frase</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="42" font-size="23" fill="#233b49">Exemplo: relacionar partes de uma frase</text><rect x="30" y="155" width="85" height="65" rx="8" fill="#bddcce"/><text x="50" y="198" font-size="27" fill="#233b49">O</text><rect x="145" y="155" width="110" height="65" rx="8" fill="#bddcce"/><text x="165" y="198" font-size="27" fill="#233b49">gato</text><rect x="285" y="155" width="110" height="65" rx="8" fill="#bddcce"/><text x="305" y="198" font-size="27" fill="#233b49">bebe</text><rect x="425" y="155" width="170" height="65" rx="8" fill="#bddcce"/><text x="445" y="198" font-size="27" fill="#233b49">leite</text><path d="M200,150 Q350,25 510,150" fill="none" stroke="#237a63" stroke-width="5" marker-end="url(#arrow)"/><text x="255" y="91" font-size="22" fill="#233b49">relação</text><text x="30" y="282" font-size="23" fill="#233b49">Atenção: uma parte usa informação de outras.</text></g></svg>