<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 335" role="img" aria-label="Query de A comparada às keys de A, B e C produz as notas 2, 0 e 2"><title>Query de A comparada às keys de A, B e C produz as notas 2, 0 e 2</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="335" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="23" fill="#233b49">A usa sua query [2; 0] para comparar:</text><rect x="35" y="65" width="265" height="52" rx="8" fill="#bddcce"/><text x="50" y="99" font-size="22" fill="#233b49">Key de A: [1; 0]</text><path d="M320,91 L425,91" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="460" y="65" width="120" height="52" rx="8" fill="#bddcce"/><text x="480" y="100" font-size="26" fill="#233b49">2</text><rect x="35" y="132" width="265" height="52" rx="8" fill="#ffe3a9"/><text x="50" y="166" font-size="22" fill="#233b49">Key de B: [0; 2]</text><path d="M320,158 L425,158" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="460" y="132" width="120" height="52" rx="8" fill="#ffe3a9"/><text x="480" y="167" font-size="26" fill="#233b49">0</text><rect x="35" y="199" width="265" height="52" rx="8" fill="#d1dced"/><text x="50" y="233" font-size="22" fill="#233b49">Key de C: [1; 2]</text><path d="M320,225 L425,225" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="460" y="199" width="120" height="52" rx="8" fill="#d1dced"/><text x="480" y="234" font-size="26" fill="#233b49">2</text><text x="35" y="307" font-size="23" fill="#233b49">Exemplo com C: 2 × 1 + 0 × 2 = 2.</text></g></svg>