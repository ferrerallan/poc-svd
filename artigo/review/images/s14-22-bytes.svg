<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Na contagem fp32, cada peso treinado tem quatro bytes e três números de apoio de quatro bytes cada"><title>Na contagem fp32, cada peso treinado tem quatro bytes e três números de apoio de quatro bytes cada</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="22" fill="#233b49">Um peso treinado vem com três números de apoio</text><rect x="35" y="90" width="125" height="90" rx="8" fill="#d1dced"/><text x="45" y="125" font-size="19" fill="#233b49">Peso</text><text x="45" y="162" font-size="22" fill="#233b49">4 bytes</text><rect x="182" y="90" width="125" height="90" rx="8" fill="#ffe3a9"/><text x="192" y="125" font-size="19" fill="#233b49">Gradiente</text><text x="192" y="162" font-size="22" fill="#233b49">4 bytes</text><rect x="329" y="90" width="125" height="90" rx="8" fill="#bddcce"/><text x="339" y="125" font-size="19" fill="#233b49">Média 1</text><text x="339" y="162" font-size="22" fill="#233b49">4 bytes</text><rect x="476" y="90" width="125" height="90" rx="8" fill="#bddcce"/><text x="486" y="125" font-size="19" fill="#233b49">Média 2</text><text x="486" y="162" font-size="22" fill="#233b49">4 bytes</text><text x="35" y="240" font-size="25" fill="#233b49">Peso congelado: 4 bytes</text><text x="35" y="285" font-size="25" fill="#233b49">Peso treinado: 4 + 12 = 16 bytes</text></g></svg>