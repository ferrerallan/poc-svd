<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 335" role="img" aria-label="O ganho de só sigma é 9,99 pontos de um ganho total de 12,53, recuperando aproximadamente 79,7%"><title>O ganho de só sigma é 9,99 pontos de um ganho total de 12,53, recuperando aproximadamente 79,7%</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="335" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="23" fill="#233b49">Do ponto de partida ao treino completo</text><rect x="35" y="115" width="570" height="35" rx="8" fill="#dce5dc"/><rect x="35" y="115" width="454.29" height="35" rx="8" fill="#ffe3a9"/><text x="35" y="94" font-size="24" fill="#233b49">60,31%</text><text x="472" y="94" font-size="24" fill="#233b49">72,84%</text><text x="35" y="205" font-size="25" fill="#233b49">Ganho total: 12,53 pontos</text><text x="35" y="250" font-size="25" fill="#233b49">Só σ ganha 9,99 desses pontos</text><text x="35" y="301" font-size="25" fill="#233b49">9,99 ÷ 12,53 ≈ 79,7% do ganho</text></g></svg>