<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" role="img" aria-label="O resultado resume menor acerto, tempo praticamente igual, pico de memória cerca de oito por cento menor e ajustes pequenos em disco"><title>O resultado resume menor acerto, tempo praticamente igual, pico de memória cerca de oito por cento menor e ajustes pequenos em disco</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="345" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="24" fill="#233b49">A troca observada neste experimento</text><rect x="35" y="65" width="570" height="51" rx="8" fill="#d1dced"/><text x="48" y="98" font-size="20" fill="#233b49">Acerto</text><text x="258" y="98" font-size="18" fill="#233b49">70,30% em vez de 72,84%</text><rect x="35" y="130" width="570" height="51" rx="8" fill="#ffe3a9"/><text x="48" y="163" font-size="20" fill="#233b49">Tempo</text><text x="258" y="163" font-size="18" fill="#233b49">Praticamente igual</text><rect x="35" y="195" width="570" height="51" rx="8" fill="#bddcce"/><text x="48" y="228" font-size="20" fill="#233b49">Pico de memória</text><text x="258" y="228" font-size="18" fill="#233b49">Cerca de 8% menor</text><rect x="35" y="260" width="570" height="51" rx="8" fill="#d1dced"/><text x="48" y="293" font-size="20" fill="#233b49">Disco por domínio</text><text x="258" y="293" font-size="18" fill="#233b49">Ajustes pequenos + outros pesos</text></g></svg>