<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Duas dúvidas: a mudança ajuda a tarefa e a régua distingue aprendizado de ruído?"><title>Duas dúvidas: a mudança ajuda a tarefa e a régua distingue aprendizado de ruído?</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="25" fill="#233b49">Duas dúvidas antes de continuar</text><rect x="35" y="70" width="570" height="95" rx="8" fill="#bddcce"/><text x="50" y="128" font-size="38" fill="#233b49">1</text><text x="95" y="106" font-size="22" fill="#233b49">O corpo mudou.</text><text x="95" y="141" font-size="22" fill="#233b49">Mas isso ajudou a acertar?</text><rect x="35" y="190" width="570" height="95" rx="8" fill="#ffe3a9"/><text x="50" y="248" font-size="38" fill="#233b49">2</text><text x="95" y="226" font-size="22" fill="#233b49">A régua mostrou uma diferença.</text><text x="95" y="261" font-size="22" fill="#233b49">Ela faria isso até com ruído?</text></g></svg>