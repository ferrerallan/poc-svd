<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Uma conta estima doze gigabytes de gradientes e estados em fp32 para um bilhão de parâmetros treinados"><title>Uma conta estima doze gigabytes de gradientes e estados em fp32 para um bilhão de parâmetros treinados</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="22" fill="#233b49">Conta de memória de apoio, não um teste novo</text><rect x="35" y="80" width="570" height="90" rx="8" fill="#d1dced"/><text x="52" y="113" font-size="25" fill="#233b49">22 milhões de parâmetros</text><text x="52" y="147" font-size="23" fill="#233b49">Ordem de 252 MB de apoio</text><rect x="35" y="195" width="570" height="90" rx="8" fill="#ffe3a9"/><text x="52" y="228" font-size="25" fill="#233b49">1 bilhão de parâmetros</text><text x="52" y="262" font-size="23" fill="#233b49">1 bilhão × 12 bytes = 12 GB</text></g></svg>