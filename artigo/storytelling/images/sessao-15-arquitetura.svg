<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title"><title id="title">Procurar uma pista no treino livre</title>
<rect width="760" height="660" rx="20" fill="#f3f6f1"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#237a63" stroke-width="1.5"/></marker></defs>
<text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#233b49">01  O caminho desta sessão</text>
<rect x="30" y="65" width="220" height="94" rx="10" fill="#cfdfed"/>
<text x="140.0" y="105.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Treino livre</text>
<text x="140.0" y="133.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Mudança nos σ</text>
<path d="M254 112 H266" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="270" y="65" width="220" height="94" rx="10" fill="#cfdfed"/>
<text x="380.0" y="105.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Treino só σ</text>
<text x="380.0" y="133.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Mudança aprendida</text>
<path d="M494 112 H506" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="510" y="65" width="220" height="94" rx="10" fill="#cfdfed"/>
<text x="620.0" y="105.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Mesmas peças</text>
<text x="620.0" y="133.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Comparar os sinais</text>
<path d="M380 171 V202" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="30" y="235" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#233b49">02  Comparar a mesma peça nos dois treinos</text>
<rect x="30" y="271" width="310" height="82" rx="10" fill="#cfdfed"/>
<text x="185.0" y="305.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Treino livre</text>
<text x="185.0" y="333.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Mudança pequena nos σ</text>
<rect x="420" y="271" width="310" height="82" rx="10" fill="#ffe2a4"/>
<text x="575.0" y="305.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Treino só σ</text>
<text x="575.0" y="333.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Mudança maior nos σ</text>
<path d="M185 363 V389 H320" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M575 363 V389 H442" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="245" y="407" width="270" height="61" rx="10" fill="#e1ebe2"/>
<text x="380.0" y="444.5" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Cosseno das listas: 0,28</text>
<path d="M380 389 V397" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="30" y="493" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#233b49">Mesmos 10 σ por matriz; sorteios diferentes em cada tipo de treino.</text>
<text x="30" y="540" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#233b49">03  O que ficou desta sessão</text>
<rect x="30" y="560" width="700" height="76" rx="10" fill="#e1ebe2"/>
<text x="48" y="588" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#233b49">Existe uma pista, mas ela é incompleta</text>
<text x="48" y="616" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#233b49">Semelhança 0,28 não significa 28% de acerto.</text>
</svg>
