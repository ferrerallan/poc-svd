<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 730" role="img" aria-labelledby="title desc"><title id="title">Como funciona a decomposição SVD</title><desc id="desc">Perfis vertical e horizontal multiplicados por sigma formam uma peça; a soma das peças reconstrói a matriz.</desc><rect width="1080" height="730" fill="#faf9f4"/><g font-family="DejaVu Sans, sans-serif"><text x="35" y="45" font-size="28" fill="#233b49" font-weight="700">O método: desmontar, escolher e somar</text><rect x="35" y="75" width="1010" height="90" rx="12" fill="#e8f1ef"/><text x="60" y="111" font-size="27" fill="#233b49" font-weight="700">W = U · Σ · Vᵀ</text><text x="60" y="145" font-size="22" fill="#233b49" font-weight="400">foto = perfis verticais × intensidades × perfis horizontais</text><text x="35" y="210" font-size="24" fill="#233b49" font-weight="700">Como se monta UMA peça (exemplo de 2 × 2)</text><rect x="35" y="235" width="220" height="130" rx="12" fill="#e8f1ef"/><text x="57" y="273" font-size="20" fill="#233b49" font-weight="400">Perfil vertical u</text><text x="57" y="309" font-size="22" fill="#233b49" font-weight="400">[0,707 ; 0,707]</text><text x="57" y="342" font-size="17" fill="#233b49" font-weight="400">uma coluna</text><text x="272" y="308" font-size="34" fill="#233b49" font-weight="400">×</text><rect x="315" y="235" width="220" height="130" rx="12" fill="#e8f1ef"/><text x="335" y="273" font-size="18" fill="#233b49" font-weight="400">Perfil horizontal vᵀ</text><text x="335" y="309" font-size="21" fill="#233b49" font-weight="400">[0,707  0,707]</text><text x="335" y="342" font-size="17" fill="#233b49" font-weight="400">uma linha</text><text x="550" y="308" font-size="34" fill="#233b49" font-weight="400">×</text><rect x="590" y="235" width="125" height="130" rx="12" fill="#f6e8c9"/><text x="610" y="273" font-size="23" fill="#233b49" font-weight="700">σ = 4</text><text x="610" y="315" font-size="20" fill="#233b49" font-weight="400">peso</text><text x="735" y="308" font-size="34" fill="#233b49" font-weight="400">=</text><rect x="780" y="235" width="265" height="130" rx="12" fill="#e8f1ef"/><text x="802" y="274" font-size="22" fill="#233b49" font-weight="700">Peça 1</text><text x="802" y="311" font-size="23" fill="#233b49" font-weight="400">[ 2  2 ]</text><text x="802" y="342" font-size="23" fill="#233b49" font-weight="400">[ 2  2 ]</text><text x="35" y="418" font-size="22" fill="#233b49" font-weight="400">Cada casa: 4 × 0,707 × 0,707 ≈ 2.</text><rect x="35" y="450" width="1010" height="165" rx="12" fill="#eef0f8"/><text x="60" y="489" font-size="23" fill="#233b49" font-weight="700">Depois, somamos as peças:</text><text x="60" y="537" font-size="28" fill="#233b49">[ 2  2 ]</text><text x="60" y="575" font-size="28" fill="#233b49">[ 2  2 ]</text><text x="240" y="557" font-size="28" fill="#233b49">+</text><text x="310" y="537" font-size="28" fill="#233b49">[ 1  −1 ]</text><text x="310" y="575" font-size="28" fill="#233b49">[−1   1 ]</text><text x="520" y="557" font-size="28" fill="#233b49">=</text><text x="590" y="537" font-size="28" fill="#233b49">[ 3  1 ]</text><text x="590" y="575" font-size="28" fill="#233b49">[ 1  3 ]</text><text x="35" y="657" font-size="23" fill="#233b49" font-weight="400">Na foto real: calcular 296 peças → escolher as primeiras N → somá-las.</text><text x="35" y="696" font-size="20" fill="#233b49" font-weight="400">Cada peça custa 296 + 336 + 1 = 633 números nos fatores.</text></g></svg>