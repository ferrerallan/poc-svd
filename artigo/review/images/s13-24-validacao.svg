<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" role="img" aria-label="Noventa por cento das fotos de treino ficam para pilotos e dez por cento para validação; o teste não escolhe o passo"><title>Noventa por cento das fotos de treino ficam para pilotos e dez por cento para validação; o teste não escolhe o passo</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="345" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="39" font-size="24" fill="#233b49">Escolher o passo usando validação</text><rect x="35" y="85" width="570" height="55" rx="8" fill="#bddcce"/><rect x="548" y="85" width="57" height="55" rx="0" fill="#ffe3a9"/><text x="48" y="121" font-size="24" fill="#233b49">90%: treinar</text><text x="360" y="185" font-size="21" fill="#233b49">10%: conferir pilotos</text><path d="M575,145 v20 h-35" stroke="#237a63" stroke-width="3" fill="none"/><rect x="35" y="215" width="570" height="61" rx="8" fill="#d1dced"/><text x="50" y="254" font-size="23" fill="#233b49">Teste final separado dessa escolha</text><text x="35" y="314" font-size="23" fill="#233b49">Validação: 368 fotos retiradas do treino.</text></g></svg>