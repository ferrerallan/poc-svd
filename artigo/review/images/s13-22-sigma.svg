<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="As intensidades das peças são multiplicadas por ajustes individuais; os padrões permanecem fixos"><title>As intensidades das peças são multiplicadas por ajustes individuais; os padrões permanecem fixos</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="340" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="39" font-size="22" fill="#233b49">Só σ: mudar intensidades sem girar padrões</text><rect x="40" y="157" width="32" height="65" rx="8" fill="#ffe3a9"/><rect x="375" y="150.5" width="32" height="71.5" rx="8" fill="#bddcce"/><rect x="98" y="122" width="32" height="100" rx="8" fill="#ffe3a9"/><rect x="433" y="132.0" width="32" height="90.0" rx="8" fill="#bddcce"/><rect x="156" y="142" width="32" height="80" rx="8" fill="#ffe3a9"/><rect x="491" y="126.0" width="32" height="96.0" rx="8" fill="#bddcce"/><path d="M245,165 L335,165" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="277" font-size="22" fill="#233b49">Exemplo: σ = 10, ajuste δ = 0,1 → σ = 11</text><text x="35" y="310" font-size="23" fill="#233b49">Um ajuste por σ: 384 por matriz.</text></g></svg>