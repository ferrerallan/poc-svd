<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title"><title id="title">Transformar a pista em um ajuste</title>
<rect width="760" height="660" rx="20" fill="#f3f6f1"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#237a63" stroke-width="1.5"/></marker></defs>
<text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#233b49">01  O caminho desta sessão</text>
<rect x="30" y="65" width="220" height="94" rx="10" fill="#cfdfed"/>
<text x="140.0" y="105.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Treino livre salvo</text>
<text x="140.0" y="133.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Extrair a pista</text>
<path d="M254 112 H266" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="270" y="65" width="220" height="94" rx="10" fill="#cfdfed"/>
<text x="380.0" y="105.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Ampliar os σ</text>
<text x="380.0" y="133.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Fator escolhido: 100</text>
<path d="M494 112 H506" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="510" y="65" width="220" height="94" rx="10" fill="#cfdfed"/>
<text x="620.0" y="105.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Mesmo classificador</text>
<text x="620.0" y="133.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Comparar as opções</text>
<path d="M380 171 V202" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="30" y="235" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#233b49">02  Acerto médio no teste (%)</text>
<text x="30" y="292" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#233b49">Corpo original</text>
<rect x="230" y="270" width="400" height="28" rx="10" fill="#e5eae3"/>
<rect x="230" y="270" width="226.6" height="28" rx="10" fill="#cfdfed"/>
<text x="730" y="292" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="end" fill="#233b49">56,65%</text>
<text x="30" y="344" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#233b49">Pista ampliada</text>
<rect x="230" y="322" width="400" height="28" rx="10" fill="#e5eae3"/>
<rect x="230" y="322" width="233.48" height="28" rx="10" fill="#cfdfed"/>
<text x="730" y="344" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="end" fill="#233b49">58,37%</text>
<text x="30" y="396" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#233b49">Ajuste aprendido</text>
<rect x="230" y="374" width="400" height="28" rx="10" fill="#e5eae3"/>
<rect x="230" y="374" width="260.312" height="28" rx="10" fill="#cfdfed"/>
<text x="730" y="396" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="end" fill="#233b49">65,08%</text>
<text x="30" y="448" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#233b49">Ajuste aleatório</text>
<rect x="230" y="426" width="400" height="28" rx="10" fill="#e5eae3"/>
<rect x="230" y="426" width="109.38" height="28" rx="10" fill="#cfdfed"/>
<text x="730" y="448" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="end" fill="#233b49">27,34%</text>
<text x="230" y="493" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#233b49">Barras na escala de 0 a 100% de acerto.</text>
<text x="30" y="540" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#233b49">03  O que ficou desta sessão</text>
<rect x="30" y="560" width="700" height="76" rx="10" fill="#e1ebe2"/>
<text x="48" y="588" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#233b49">A pista ajuda, mas não substitui aprender o ajuste</text>
<text x="48" y="616" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#233b49">O controle aleatório recebeu uma mudança do mesmo tamanho.</text>
</svg>