<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="A próxima sessão treinará modelos restringindo a mudança a sigma ou a direções desde o início"><title>A próxima sessão treinará modelos restringindo a mudança a sigma ou a direções desde o início</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="340" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="23" fill="#233b49">Próximo teste: deixar cada parte aprender</text><rect x="35" y="80" width="255" height="140" rx="8" fill="#ffe3a9"/><text x="60" y="133" font-size="30" fill="#233b49">Só σ</text><text x="60" y="180" font-size="18" fill="#233b49">Treinar desde o início</text><rect x="350" y="80" width="255" height="140" rx="8" fill="#d1dced"/><text x="375" y="133" font-size="30" fill="#233b49">Só direções</text><text x="375" y="180" font-size="18" fill="#233b49">Treinar desde o início</text><text x="35" y="280" font-size="20" fill="#233b49">Guardar um pedaço de um treino pronto é diferente</text><text x="35" y="309" font-size="22" fill="#233b49">de treinar com apenas esse pedaço livre.</text></g></svg>