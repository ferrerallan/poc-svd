<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Cinco épocas: a primeira com o corpo congelado, as outras quatro com o corpo liberado"><title>Cinco épocas: a primeira com o corpo congelado, as outras quatro com o corpo liberado</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="25" fill="#233b49">Plano de treino: 5 épocas, 575 passos</text><rect x="35" y="80" width="100" height="100" rx="8" fill="#ffe3a9"/><text x="46" y="115" font-size="19" fill="#233b49">Época 1</text><text x="46" y="151" font-size="15" fill="#233b49">115 passos</text><rect x="150" y="80" width="100" height="100" rx="8" fill="#bddcce"/><text x="161" y="115" font-size="19" fill="#233b49">Época 2</text><text x="161" y="151" font-size="15" fill="#233b49">115 passos</text><rect x="265" y="80" width="100" height="100" rx="8" fill="#bddcce"/><text x="276" y="115" font-size="19" fill="#233b49">Época 3</text><text x="276" y="151" font-size="15" fill="#233b49">115 passos</text><rect x="380" y="80" width="100" height="100" rx="8" fill="#bddcce"/><text x="391" y="115" font-size="19" fill="#233b49">Época 4</text><text x="391" y="151" font-size="15" fill="#233b49">115 passos</text><rect x="495" y="80" width="100" height="100" rx="8" fill="#bddcce"/><text x="506" y="115" font-size="19" fill="#233b49">Época 5</text><text x="506" y="151" font-size="15" fill="#233b49">115 passos</text><text x="35" y="227" font-size="24" fill="#233b49">1ª época: só a cabeça muda</text><text x="35" y="267" font-size="24" fill="#233b49">2ª à 5ª: cabeça e corpo podem mudar</text></g></svg>