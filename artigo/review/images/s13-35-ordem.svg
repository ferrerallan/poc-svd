<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Os dois maiores componentes passam de A e B para C e A porque os pesos mudaram, sem girar os padrões"><title>Os dois maiores componentes passam de A e B para C e A porque os pesos mudaram, sem girar os padrões</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="340" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="39" font-size="21" fill="#233b49">Um grupo dos maiores pode trocar de membros</text><text x="35" y="84" font-size="24" fill="#233b49">Antes</text><rect x="35" y="110" width="150" height="28" rx="8" fill="#bddcce"/><text x="229" y="134" font-size="23" fill="#233b49">A: 10</text><rect x="35" y="162" width="135" height="28" rx="8" fill="#ffe3a9"/><text x="229" y="186" font-size="23" fill="#233b49">B: 9</text><rect x="35" y="214" width="120" height="28" rx="8" fill="#d1dced"/><text x="229" y="238" font-size="23" fill="#233b49">C: 8</text><rect x="28" y="102" width="264" height="96" fill="none" stroke="#237a63" stroke-width="2" stroke-dasharray="5 4"/><text x="350" y="84" font-size="24" fill="#233b49">Depois</text><rect x="350" y="110" width="180" height="28" rx="8" fill="#d1dced"/><text x="544" y="134" font-size="23" fill="#233b49">C: 12</text><rect x="350" y="162" width="150" height="28" rx="8" fill="#bddcce"/><text x="544" y="186" font-size="23" fill="#233b49">A: 10</text><rect x="350" y="214" width="135" height="28" rx="8" fill="#ffe3a9"/><text x="544" y="238" font-size="23" fill="#233b49">B: 9</text><rect x="343" y="102" width="264" height="96" fill="none" stroke="#237a63" stroke-width="2" stroke-dasharray="5 4"/><text x="35" y="310" font-size="21" fill="#233b49">Os dois maiores mudaram. Os padrões continuam.</text></g></svg>