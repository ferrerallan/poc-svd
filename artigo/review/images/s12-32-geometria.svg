<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" role="img" aria-label="As medidas de sigma e direções superam o ruído tanto no treino real quanto no de rótulos trocados"><title>As medidas de sigma e direções superam o ruído tanto no treino real quanto no de rótulos trocados</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="345" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="39" font-size="22" fill="#233b49">Quantas vezes cada medida supera seu ruído?</text><text x="35" y="78" font-size="22" fill="#233b49">σ</text><rect x="35" y="93" width="244.95" height="22" rx="8" fill="#bddcce"/><rect x="35" y="122" width="276.0" height="22" rx="8" fill="#ffe3a9"/><text x="360" y="112" font-size="22" fill="#233b49">Real: 2,13</text><text x="360" y="143" font-size="22" fill="#233b49">Trocado: 2,40</text><text x="35" y="183" font-size="22" fill="#233b49">Direções: subespaço</text><rect x="35" y="198" width="163.29999999999998" height="22" rx="8" fill="#bddcce"/><rect x="35" y="227" width="165.6" height="22" rx="8" fill="#ffe3a9"/><text x="360" y="217" font-size="22" fill="#233b49">Real: 1,42</text><text x="360" y="248" font-size="22" fill="#233b49">Trocado: 1,44</text><text x="35" y="315" font-size="22" fill="#233b49">Superar o ruído não distingue os dois treinos.</text></g></svg>