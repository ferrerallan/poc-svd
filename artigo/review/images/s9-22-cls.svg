<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 325" role="img" aria-label="O gradiente nas notas passa pela cabeça fixa e chega aos dois números do CLS"><title>O gradiente nas notas passa pela cabeça fixa e chega aos dois números do CLS</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="325" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="39" font-size="25" fill="#233b49">O gradiente atravessa a cabeça</text><rect x="35" y="78" width="240" height="118" rx="8" fill="#ffe3a9"/><text x="52" y="111" font-size="22" fill="#233b49">Sinais nas notas</text><text x="52" y="154" font-size="20" fill="#233b49">[−0,6225; +0,6225]</text><path d="M300,138 L365,138" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="390" y="78" width="215" height="118" rx="8" fill="#bddcce"/><text x="404" y="111" font-size="22" fill="#233b49">Sinais no CLS</text><text x="404" y="154" font-size="18" fill="#233b49">[−0,3112; +0,3112]</text><text x="35" y="252" font-size="23" fill="#233b49">Neste exemplo: subir o 1º número do CLS</text><text x="35" y="288" font-size="23" fill="#233b49">e baixar o 2º ajuda a reduzir a perda.</text></g></svg>