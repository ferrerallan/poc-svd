<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Nas matrizes fc1 e fc2, a pegada é pequena, mas os alinhamentos entre sementes diferentes são 0,17 e 0,21"><title>Nas matrizes fc1 e fc2, a pegada é pequena, mas os alinhamentos entre sementes diferentes são 0,17 e 0,21</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="21" fill="#233b49">Uma pegada pequena ainda pode ser informativa</text><rect x="35" y="80" width="570" height="89" rx="8" fill="#bddcce"/><text x="50" y="116" font-size="28" fill="#233b49">fc1</text><text x="155" y="115" font-size="21" fill="#233b49">Pegada: 0,015%</text><text x="155" y="150" font-size="21" fill="#233b49">Alinhamento cruzado: 0,17</text><rect x="35" y="190" width="570" height="89" rx="8" fill="#ffe3a9"/><text x="50" y="226" font-size="28" fill="#233b49">fc2</text><text x="155" y="225" font-size="21" fill="#233b49">Pegada: 0,016%</text><text x="155" y="260" font-size="21" fill="#233b49">Alinhamento cruzado: 0,21</text></g></svg>