<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="O transplante separa uma mudança já pronta; o novo treino restringe desde o começo o que as matrizes podem alterar"><title>O transplante separa uma mudança já pronta; o novo treino restringe desde o começo o que as matrizes podem alterar</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="39" font-size="25" fill="#233b49">Duas perguntas diferentes</text><rect x="35" y="70" width="570" height="96" rx="8" fill="#d1dced"/><text x="50" y="104" font-size="23" fill="#233b49">Sessão 12: depois do treino</text><text x="50" y="140" font-size="20" fill="#233b49">Guardar só um pedaço da mudança pronta.</text><rect x="35" y="195" width="570" height="96" rx="8" fill="#bddcce"/><text x="50" y="229" font-size="23" fill="#233b49">Sessão 13: durante o treino</text><text x="50" y="265" font-size="20" fill="#233b49">Permitir só um tipo de mudança desde o início.</text></g></svg>