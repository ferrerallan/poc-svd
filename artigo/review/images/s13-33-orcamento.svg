<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="As variantes têm quantidades diferentes de parâmetros livres: 27.648 em sigma, 642.816 efetivos em rotação e 21.233.664 no treino completo"><title>As variantes têm quantidades diferentes de parâmetros livres: 27.648 em sigma, 642.816 efetivos em rotação e 21.233.664 no treino completo</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="360" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="39" font-size="23" fill="#233b49">Quantos ajustes livres nas 72 matrizes?</text><rect x="35" y="65" width="570" height="61" rx="8" fill="#ffe3a9"/><text x="50" y="103" font-size="24" fill="#233b49">Só σ</text><text x="283" y="103" font-size="27" fill="#233b49">27.648</text><rect x="35" y="145" width="570" height="61" rx="8" fill="#bddcce"/><text x="50" y="183" font-size="24" fill="#233b49">Só rotação</text><text x="283" y="183" font-size="27" fill="#233b49">642.816 efetivos</text><rect x="35" y="225" width="570" height="61" rx="8" fill="#d1dced"/><text x="50" y="263" font-size="24" fill="#233b49">Completa</text><text x="283" y="263" font-size="27" fill="#233b49">21.233.664</text><text x="35" y="330" font-size="22" fill="#233b49">A rotação tem cerca de 23 vezes mais ajustes.</text></g></svg>