<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Um treino malsucedido deu 17,72%; com aquecimento e passo menor, dez treinos deram média de 94,15%"><title>Um treino malsucedido deu 17,72%; com aquecimento e passo menor, dez treinos deram média de 94,15%</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="24" fill="#233b49">O primeiro treino não funcionou bem</text><rect x="35" y="73" width="250" height="120" rx="8" fill="#ffe3a9"/><text x="50" y="110" font-size="22" fill="#233b49">Sem aquecimento</text><text x="50" y="159" font-size="25" fill="#233b49">17,72% de acerto</text><rect x="350" y="73" width="255" height="120" rx="8" fill="#bddcce"/><text x="365" y="110" font-size="21" fill="#233b49">Protocolo corrigido</text><text x="365" y="159" font-size="25" fill="#233b49">94,15% em média</text><text x="35" y="248" font-size="24" fill="#233b49">Duas mudanças no protocolo:</text><text x="35" y="286" font-size="23" fill="#233b49">aquecimento + passo menor no corpo.</text></g></svg>