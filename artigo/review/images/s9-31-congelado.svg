<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 325" role="img" aria-label="Após a época congelada, nenhum conjunto do corpo mudou e os pesos da cabeça tiveram deslocamento relativo de cerca de 50%"><title>Após a época congelada, nenhum conjunto do corpo mudou e os pesos da cabeça tiveram deslocamento relativo de cerca de 50%</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="325" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="39" font-size="23" fill="#233b49">Depois dos 115 passos com corpo congelado</text><rect x="35" y="75" width="255" height="170" rx="8" fill="#d1dced"/><text x="52" y="115" font-size="27" fill="#233b49">Corpo</text><text x="52" y="160" font-size="33" fill="#233b49">0 de 223</text><text x="52" y="203" font-size="20" fill="#233b49">conjuntos mudaram</text><rect x="350" y="75" width="255" height="170" rx="8" fill="#ffe3a9"/><text x="367" y="115" font-size="27" fill="#233b49">Cabeça</text><text x="367" y="160" font-size="33" fill="#233b49">≈ 50%</text><text x="367" y="203" font-size="20" fill="#233b49">de deslocamento</text><text x="35" y="295" font-size="22" fill="#233b49">A cabeça aprende enquanto o corpo fica parado.</text></g></svg>