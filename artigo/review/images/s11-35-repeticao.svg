<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="As duas execuções da mesma semente atingem 94,17% de acerto, embora somente um conjunto do corpo seja idêntico"><title>As duas execuções da mesma semente atingem 94,17% de acerto, embora somente um conjunto do corpo seja idêntico</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="340" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="24" fill="#233b49">Mesmo acerto não exige pesos idênticos</text><rect x="35" y="75" width="250" height="145" rx="8" fill="#bddcce"/><text x="52" y="115" font-size="26" fill="#233b49">Execução 1</text><text x="52" y="173" font-size="36" fill="#233b49">94,17%</text><rect x="355" y="75" width="250" height="145" rx="8" fill="#ffe3a9"/><text x="372" y="115" font-size="26" fill="#233b49">Execução 2</text><text x="372" y="173" font-size="36" fill="#233b49">94,17%</text><text x="35" y="271" font-size="24" fill="#233b49">Só 1 dos 223 conjuntos ficou idêntico.</text><text x="35" y="308" font-size="21" fill="#233b49">Os outros podem variar sem mudar esse acerto.</text></g></svg>