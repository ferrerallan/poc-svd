<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title"><title id="title">Repetir o teste com um modelo maior</title>
<rect width="760" height="660" rx="20" fill="#f3f6f1"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#237a63" stroke-width="1.5"/></marker></defs>
<text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#233b49">01  O caminho desta sessão</text>
<rect x="30" y="65" width="220" height="94" rx="10" fill="#cfdfed"/>
<text x="140.0" y="105.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Pele</text>
<text x="140.0" y="133.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Mesmo domínio</text>
<path d="M254 112 H266" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="270" y="65" width="220" height="94" rx="10" fill="#cfdfed"/>
<text x="380.0" y="105.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Small → Base</text>
<text x="380.0" y="133.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">22 → 87 milhões</text>
<path d="M494 112 H506" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="510" y="65" width="220" height="94" rx="10" fill="#cfdfed"/>
<text x="620.0" y="105.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Repetir e medir</text>
<text x="620.0" y="133.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Acerto e custo</text>
<path d="M380 171 V202" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="30" y="235" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#233b49">02  Acerto médio no teste (%)</text>
<text x="30" y="292" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#233b49">72 fixas</text>
<rect x="230" y="270" width="400" height="28" rx="10" fill="#e5eae3"/>
<rect x="230" y="270" width="258.38" height="28" rx="10" fill="#cfdfed"/>
<text x="730" y="292" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="end" fill="#233b49">64,59%</text>
<text x="30" y="344" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#233b49">Só σ</text>
<rect x="230" y="322" width="400" height="28" rx="10" fill="#e5eae3"/>
<rect x="230" y="322" width="297.972" height="28" rx="10" fill="#ffe2a4"/>
<text x="730" y="344" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="end" fill="#233b49">74,49%</text>
<text x="30" y="396" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#233b49">Rotação pequena</text>
<rect x="230" y="374" width="400" height="28" rx="10" fill="#e5eae3"/>
<rect x="230" y="374" width="288.788" height="28" rx="10" fill="#cfdfed"/>
<text x="730" y="396" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="end" fill="#233b49">72,20%</text>
<text x="30" y="448" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#233b49">Treino livre</text>
<rect x="230" y="426" width="400" height="28" rx="10" fill="#e5eae3"/>
<rect x="230" y="426" width="301.408" height="28" rx="10" fill="#cfdfed"/>
<text x="730" y="448" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="end" fill="#233b49">75,35%</text>
<text x="230" y="493" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#233b49">Barras na escala de 0 a 100% de acerto.</text>
<text x="30" y="540" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#233b49">03  O que ficou desta sessão</text>
<rect x="30" y="560" width="700" height="76" rx="10" fill="#e1ebe2"/>
<text x="48" y="588" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#233b49">Só σ recuperou 92% do ganho no modelo maior</text>
<text x="48" y="616" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#233b49">Base com só σ superou Small livre, mas usou mais memória.</text>
</svg>