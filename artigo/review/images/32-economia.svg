<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Comparação entre os números da foto e dos fatores"><title>Comparação entre os números da foto e dos fatores</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="340" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="43" font-size="23" fill="#233b49">Quantidade de números para guardar</text><text x="35" y="103" font-size="23" fill="#233b49">Foto inteira</text><rect x="35" y="125" width="565" height="38" rx="6" fill="#75988b"/><text x="35" y="196" font-size="23" fill="#233b49">35 peças</text><rect x="35" y="218" width="126" height="38" rx="6" fill="#e6ac45"/><text x="335" y="153" font-size="25" fill="white">99.456</text><text x="185" y="246" font-size="25" fill="#233b49">22.155</text><text x="35" y="303" font-size="24" fill="#233b49">Cerca de 22 de cada 100 números.</text></g></svg>