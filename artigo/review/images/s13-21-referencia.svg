<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="As 72 matrizes ficam congeladas; a cabeça e os outros parâmetros continuam aprendendo"><title>As 72 matrizes ficam congeladas; a cabeça e os outros parâmetros continuam aprendendo</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="23" fill="#233b49">Referência: as 72 matrizes ficam paradas</text><rect x="35" y="80" width="255" height="160" rx="8" fill="#d1dced"/><text x="50" y="117" font-size="27" fill="#233b49">72 matrizes</text><text x="50" y="158" font-size="24" fill="#233b49">Não mudam</text><rect x="218" y="188" width="35" height="30" rx="4" fill="#237a63"/><path d="M226,188 v-14 a10,10 0 0 1 20,0 v14" fill="none" stroke="#237a63" stroke-width="5"/><path d="M310,160 L345,160" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="365" y="80" width="240" height="160" rx="8" fill="#bddcce"/><text x="381" y="116" font-size="22" fill="#233b49">Cabeça + outros</text><text x="381" y="151" font-size="23" fill="#233b49">parâmetros</text><text x="381" y="207" font-size="19" fill="#233b49">Continuam treinando</text></g></svg>