<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 325" role="img" aria-label="Energia ilustrada com vinte quadrados, dezesseis da primeira peça"><title>Energia ilustrada com vinte quadrados, dezesseis da primeira peça</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="325" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="44" font-size="23" fill="#233b49">Exemplo pequeno: os σ são 4 e 2</text><rect x="42" y="82" width="46" height="46" rx="6" fill="#237a63"/><rect x="98" y="82" width="46" height="46" rx="6" fill="#237a63"/><rect x="154" y="82" width="46" height="46" rx="6" fill="#237a63"/><rect x="210" y="82" width="46" height="46" rx="6" fill="#237a63"/><rect x="266" y="82" width="46" height="46" rx="6" fill="#237a63"/><rect x="322" y="82" width="46" height="46" rx="6" fill="#237a63"/><rect x="378" y="82" width="46" height="46" rx="6" fill="#237a63"/><rect x="434" y="82" width="46" height="46" rx="6" fill="#237a63"/><rect x="490" y="82" width="46" height="46" rx="6" fill="#237a63"/><rect x="546" y="82" width="46" height="46" rx="6" fill="#237a63"/><rect x="42" y="142" width="46" height="46" rx="6" fill="#237a63"/><rect x="98" y="142" width="46" height="46" rx="6" fill="#237a63"/><rect x="154" y="142" width="46" height="46" rx="6" fill="#237a63"/><rect x="210" y="142" width="46" height="46" rx="6" fill="#237a63"/><rect x="266" y="142" width="46" height="46" rx="6" fill="#237a63"/><rect x="322" y="142" width="46" height="46" rx="6" fill="#237a63"/><rect x="378" y="142" width="46" height="46" rx="6" fill="#e6ac45"/><rect x="434" y="142" width="46" height="46" rx="6" fill="#e6ac45"/><rect x="490" y="142" width="46" height="46" rx="6" fill="#e6ac45"/><rect x="546" y="142" width="46" height="46" rx="6" fill="#e6ac45"/><text x="35" y="243" font-size="23" fill="#233b49">4² = 16</text><text x="240" y="243" font-size="23" fill="#233b49">2² = 4</text><text x="420" y="243" font-size="23" fill="#233b49">Total = 20</text><text x="35" y="295" font-size="24" fill="#233b49">A primeira peça guarda 16 de 20: 80%.</text></g></svg>