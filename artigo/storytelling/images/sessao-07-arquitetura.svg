<svg xmlns="http://www.w3.org/2000/svg" width="760" height="660" viewBox="0 0 760 660" role="img" aria-labelledby="title"><title id="title">Escolher as fotos para o primeiro teste</title>
<rect width="760" height="660" rx="20" fill="#f3f6f1"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#237a63" stroke-width="1.5"/></marker></defs>
<text x="30" y="42" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#233b49">01  O caminho desta sessão</text>
<rect x="30" y="65" width="220" height="94" rx="10" fill="#cfdfed"/>
<text x="140.0" y="105.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Oxford-IIIT Pet</text>
<text x="140.0" y="133.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">7.349 fotos</text>
<path d="M254 112 H266" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="270" y="65" width="220" height="94" rx="10" fill="#cfdfed"/>
<text x="380.0" y="105.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">37 raças</text>
<text x="380.0" y="133.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Conferir os dados</text>
<path d="M494 112 H506" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="510" y="65" width="220" height="94" rx="10" fill="#cfdfed"/>
<text x="620.0" y="105.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">Dois grupos</text>
<text x="620.0" y="133.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Treino e teste</text>
<path d="M380 171 V202" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="30" y="235" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#233b49">02  Separar aprender de avaliar</text>
<rect x="30" y="308" width="175" height="94" rx="10" fill="#cfdfed"/>
<text x="117.5" y="348.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">37 raças</text>
<text x="117.5" y="376.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Cães e gatos</text>
<path d="M215 355 H255 V313 H294" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="305" y="270" width="425" height="86" rx="10" fill="#e1ebe2"/>
<text x="517.5" y="306.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">3.680 fotos</text>
<text x="517.5" y="334.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Treinar o modelo</text>
<path d="M215 355 H255 V423 H294" fill="none" stroke="#237a63" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="305" y="380" width="425" height="86" rx="10" fill="#ffe2a4"/>
<text x="517.5" y="416.0" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#233b49">3.669 fotos</text>
<text x="517.5" y="444.0" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#233b49">Medir o acerto</text>
<text x="30" y="540" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#233b49">03  O que ficou desta sessão</text>
<rect x="30" y="560" width="700" height="76" rx="10" fill="#e1ebe2"/>
<text x="48" y="588" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#233b49">O teste fica separado do aprendizado</text>
<text x="48" y="616" font-family="DejaVu Sans,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#233b49">Ele mede o acerto em fotos que não entraram no treino.</text>
</svg>