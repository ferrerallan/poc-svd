<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="A atenção mistura informações entre tokens; depois, o MLP transforma cada token separadamente"><title>A atenção mistura informações entre tokens; depois, o MLP transforma cada token separadamente</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="42" font-size="25" fill="#233b49">Dentro de um bloco</text><rect x="30" y="108" width="250" height="110" rx="8" fill="#d1dced"/><text x="52" y="150" font-size="29" fill="#233b49">Atenção</text><text x="52" y="187" font-size="20" fill="#233b49">Mistura tokens</text><rect x="350" y="108" width="250" height="110" rx="8" fill="#bddcce"/><text x="372" y="150" font-size="29" fill="#233b49">MLP</text><text x="372" y="187" font-size="20" fill="#233b49">Trata um por vez</text><path d="M290,164 L334,164" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="35" y="280" font-size="23" fill="#233b49">Trocar informação → transformar cada lista</text></g></svg>