<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="O armazenamento por domínio precisa dos deltas, dos outros pesos alterados e da cabeça, além do modelo base compartilhado"><title>O armazenamento por domínio precisa dos deltas, dos outros pesos alterados e da cabeça, além do modelo base compartilhado</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="340" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="23" fill="#233b49">Para guardar a adaptação de um domínio</text><rect x="35" y="67" width="570" height="67" rx="8" fill="#d1dced"/><text x="50" y="95" font-size="23" fill="#233b49">Modelo base</text><text x="50" y="122" font-size="19" fill="#233b49">Compartilhado entre tarefas</text><rect x="35" y="151" width="570" height="67" rx="8" fill="#ffe3a9"/><text x="50" y="179" font-size="23" fill="#233b49">δ do σ</text><text x="50" y="206" font-size="19" fill="#233b49">129 KB</text><rect x="35" y="235" width="570" height="67" rx="8" fill="#bddcce"/><text x="50" y="263" font-size="23" fill="#233b49">Outros pesos + cabeça</text><text x="50" y="290" font-size="19" fill="#233b49">Também precisam ser guardados</text></g></svg>