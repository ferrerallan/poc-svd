<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" role="img" aria-label="O alinhamento entre sementes diferentes é 0,08 nos 384 componentes e 0,28 nos dez maiores componentes originais"><title>O alinhamento entre sementes diferentes é 0,08 nos 384 componentes e 0,28 nos dez maiores componentes originais</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="345" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="25" fill="#233b49">Alinhamento: livre contra só σ</text><rect x="35" y="85" width="570" height="87" rx="8" fill="#d1dced"/><text x="50" y="114" font-size="23" fill="#233b49">384 componentes</text><text x="50" y="149" font-size="20" fill="#233b49">Mesma semente: 0,19</text><text x="345" y="149" font-size="22" fill="#233b49">Outra: 0,08</text><rect x="35" y="197" width="570" height="87" rx="8" fill="#bddcce"/><text x="50" y="226" font-size="23" fill="#233b49">10 maiores originais</text><text x="50" y="261" font-size="20" fill="#233b49">Mesma semente: 0,50</text><text x="345" y="261" font-size="22" fill="#233b49">Outra: 0,28</text><text x="35" y="319" font-size="21" fill="#233b49">Os pares cruzados evitam o sorteio compartilhado.</text></g></svg>