<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Quatro compartimentos representam pesos, gradientes, histórico do otimizador e ativações"><title>Quatro compartimentos representam pesos, gradientes, histórico do otimizador e ativações</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="24" fill="#233b49">Quatro partes da memória no treino</text><rect x="35" y="70" width="260" height="92" rx="8" fill="#d1dced"/><text x="50" y="103" font-size="25" fill="#233b49">Pesos</text><text x="50" y="138" font-size="19" fill="#233b49">Números do modelo</text><rect x="345" y="70" width="260" height="92" rx="8" fill="#ffe3a9"/><text x="360" y="103" font-size="25" fill="#233b49">Gradientes</text><text x="360" y="138" font-size="19" fill="#233b49">Como ajustar os pesos</text><rect x="35" y="187" width="260" height="92" rx="8" fill="#bddcce"/><text x="50" y="220" font-size="25" fill="#233b49">Otimizador</text><text x="50" y="255" font-size="19" fill="#233b49">Histórico dos ajustes</text><rect x="345" y="187" width="260" height="92" rx="8" fill="#d1dced"/><text x="360" y="220" font-size="25" fill="#233b49">Ativações</text><text x="360" y="255" font-size="19" fill="#233b49">Resultados das fotos</text></g></svg>