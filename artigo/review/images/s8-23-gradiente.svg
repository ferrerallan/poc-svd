<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" aria-label="Os gradientes negativos da linha de A fazem seus pesos aumentar; os positivos da linha de B fazem os pesos diminuir"><title>Os gradientes negativos da linha de A fazem seus pesos aumentar; os positivos da linha de B fazem os pesos diminuir</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="310" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="23" fill="#233b49">Gradiente: como cada peso afeta o erro</text><rect x="35" y="75" width="245" height="130" rx="8" fill="#bddcce"/><text x="50" y="110" font-size="24" fill="#233b49">Linha de A</text><text x="50" y="149" font-size="22" fill="#233b49">−0,6225; −1,245</text><text x="50" y="187" font-size="19" fill="#233b49">Subtrair → aumentar</text><rect x="345" y="75" width="260" height="130" rx="8" fill="#ffe3a9"/><text x="360" y="110" font-size="24" fill="#233b49">Linha de B</text><text x="360" y="149" font-size="22" fill="#233b49">+0,6225; +1,245</text><text x="360" y="187" font-size="19" fill="#233b49">Subtrair → diminuir</text><text x="35" y="266" font-size="26" fill="#233b49">Novo = antigo − passo × gradiente</text></g></svg>