<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 325" role="img" aria-label="O exemplo com ReLU produz uma correção 4 e 1, somada ao token original para dar 5 e 3"><title>O exemplo com ReLU produz uma correção 4 e 1, somada ao token original para dar 5 e 3</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="325" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><rect x="35" y="20" width="230" height="70" rx="8" fill="#ffe3a9"/><text x="48" y="48" font-size="21" fill="#233b49">Respostas</text><text x="48" y="75" font-size="24" fill="#233b49">[1; 2; 3; −1]</text><rect x="35" y="115" width="230" height="70" rx="8" fill="#d1dced"/><text x="48" y="143" font-size="21" fill="#233b49">Após ReLU</text><text x="48" y="170" font-size="24" fill="#233b49">[1; 2; 3; 0]</text><rect x="35" y="210" width="230" height="70" rx="8" fill="#bddcce"/><text x="48" y="238" font-size="21" fill="#233b49">Após fc2</text><text x="48" y="265" font-size="24" fill="#233b49">[4; 1]</text><text x="315" y="63" font-size="26" fill="#233b49">1 + 3 = 4</text><text x="315" y="160" font-size="26" fill="#233b49">1 + 0 = 1</text><text x="315" y="247" font-size="20" fill="#233b49">E somamos à entrada:</text><text x="315" y="286" font-size="21" fill="#233b49">[1; 2] + [4; 1] = [5; 3]</text></g></svg>