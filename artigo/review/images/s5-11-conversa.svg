<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Tokens B e C enviam informação ao token A"><title>Tokens B e C enviam informação ao token A</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="330" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><rect x="30" y="105" width="150" height="70" rx="8" fill="#bddcce"/><text x="42" y="133" font-size="20" fill="#233b49">A</text><text x="42" y="160" font-size="21" fill="#233b49">[1; 0]</text><rect x="460" y="30" width="150" height="70" rx="8" fill="#ffe3a9"/><text x="472" y="58" font-size="20" fill="#233b49">B</text><text x="472" y="85" font-size="21" fill="#233b49">[0; 1]</text><rect x="460" y="195" width="150" height="70" rx="8" fill="#d1dced"/><text x="472" y="223" font-size="20" fill="#233b49">C</text><text x="472" y="250" font-size="21" fill="#233b49">[1; 1]</text><path d="M440,67 L200,120" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M440,230 L200,165" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="225" y="132" font-size="22" fill="#233b49">Quanto usar</text><text x="225" y="160" font-size="22" fill="#233b49">de cada um?</text><text x="30" y="300" font-size="22" fill="#233b49">Cada token pode receber informação dos outros.</text></g></svg>