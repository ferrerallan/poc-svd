<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="As contas seguem do corpo à cabeça e ao erro; os gradientes seguem de volta"><title>As contas seguem do corpo à cabeça e ao erro; os gradientes seguem de volta</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="320" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="24" fill="#233b49">A resposta errada pode orientar o corpo?</text><rect x="35" y="85" width="130" height="80" rx="8" fill="#d1dced"/><text x="50" y="134" font-size="25" fill="#233b49">Corpo</text><rect x="255" y="85" width="130" height="80" rx="8" fill="#ffe3a9"/><text x="270" y="134" font-size="25" fill="#233b49">Cabeça</text><rect x="475" y="85" width="130" height="80" rx="8" fill="#bddcce"/><text x="490" y="134" font-size="25" fill="#233b49">Erro</text><path d="M180,125 L238,125" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M398,125 L458,125" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M540,205 L105,205" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="188" y="255" font-size="25" fill="#233b49">Gradientes voltam</text></g></svg>