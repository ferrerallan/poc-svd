<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" role="img" aria-label="Os deslocamentos médios foram 0,54% no treino completo, 2,22% em rotação e 9,28% em sigma"><title>Os deslocamentos médios foram 0,54% no treino completo, 2,22% em rotação e 9,28% em sigma</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="345" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="39" font-size="25" fill="#233b49">Deslocamento médio das matrizes</text><text x="35" y="85" font-size="22" fill="#233b49">Completa</text><rect x="35" y="98" width="24.3" height="27" rx="8" fill="#d1dced"/><text x="490" y="121" font-size="24" fill="#233b49">0,54%</text><text x="35" y="161" font-size="22" fill="#233b49">Só rotação</text><rect x="35" y="174" width="99.9" height="27" rx="8" fill="#bddcce"/><text x="490" y="197" font-size="24" fill="#233b49">2,22%</text><text x="35" y="237" font-size="22" fill="#233b49">Só σ</text><rect x="35" y="250" width="417.59999999999997" height="27" rx="8" fill="#ffe3a9"/><text x="490" y="273" font-size="24" fill="#233b49">9,28%</text><text x="35" y="319" font-size="21" fill="#233b49">Menos ajustes livres não implica menor movimento.</text></g></svg>