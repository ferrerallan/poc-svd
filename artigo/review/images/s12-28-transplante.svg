<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="O transplante preserva a cabeça treinada e os demais parâmetros, trocando somente as 72 matrizes"><title>O transplante preserva a cabeça treinada e os demais parâmetros, trocando somente as 72 matrizes</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="330" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="39" font-size="24" fill="#233b49">Transplante: trocar só as 72 matrizes</text><rect x="35" y="75" width="180" height="175" rx="8" fill="#d1dced"/><text x="52" y="113" font-size="19" fill="#233b49">Modelo treinado</text><rect x="65" y="137" width="17" height="17" rx="2" fill="#91b7a6"/><rect x="87" y="137" width="17" height="17" rx="2" fill="#e6ac45"/><rect x="109" y="137" width="17" height="17" rx="2" fill="#d1dced"/><rect x="131" y="137" width="17" height="17" rx="2" fill="#91b7a6"/><rect x="65" y="159" width="17" height="17" rx="2" fill="#e6ac45"/><rect x="87" y="159" width="17" height="17" rx="2" fill="#d1dced"/><rect x="109" y="159" width="17" height="17" rx="2" fill="#91b7a6"/><rect x="131" y="159" width="17" height="17" rx="2" fill="#e6ac45"/><rect x="65" y="181" width="17" height="17" rx="2" fill="#d1dced"/><rect x="87" y="181" width="17" height="17" rx="2" fill="#91b7a6"/><rect x="109" y="181" width="17" height="17" rx="2" fill="#e6ac45"/><rect x="131" y="181" width="17" height="17" rx="2" fill="#d1dced"/><rect x="65" y="203" width="17" height="17" rx="2" fill="#91b7a6"/><rect x="87" y="203" width="17" height="17" rx="2" fill="#e6ac45"/><rect x="109" y="203" width="17" height="17" rx="2" fill="#d1dced"/><rect x="131" y="203" width="17" height="17" rx="2" fill="#91b7a6"/><path d="M235,160 L300,160" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="325" y="75" width="280" height="175" rx="8" fill="#bddcce"/><text x="343" y="113" font-size="23" fill="#233b49">Versão montada</text><text x="343" y="153" font-size="20" fill="#233b49">Cabeça: fica igual</text><text x="343" y="188" font-size="18" fill="#233b49">Outros ajustes: iguais</text><text x="343" y="225" font-size="19" fill="#233b49">72 matrizes: trocadas</text><text x="35" y="302" font-size="24" fill="#233b49">Depois da troca, medir o acerto.</text></g></svg>