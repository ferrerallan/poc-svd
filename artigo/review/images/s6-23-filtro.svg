<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 315" role="img" aria-label="ReLU transforma menos 1 em zero; GELU transforma menos 1 em aproximadamente menos 0,159"><title>ReLU transforma menos 1 em zero; GELU transforma menos 1 em aproximadamente menos 0,159</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#237a63"/></marker></defs><rect width="640" height="315" fill="#f4f6f1"/><g font-family="DejaVu Sans,sans-serif"><text x="35" y="40" font-size="24" fill="#233b49">Exemplo simples: cortar os negativos</text><rect x="35" y="65" width="120" height="65" rx="8" fill="#ffe3a9"/><text x="72" y="109" font-size="27" fill="#233b49">−1</text><rect x="470" y="65" width="120" height="65" rx="8" fill="#bddcce"/><text x="507" y="109" font-size="27" fill="#233b49">0</text><path d="M180,98 L435,98" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="250" y="85" font-size="23" fill="#233b49">ReLU</text><text x="35" y="190" font-size="24" fill="#233b49">Modelo real: ajuste suave</text><rect x="35" y="215" width="120" height="65" rx="8" fill="#ffe3a9"/><text x="72" y="259" font-size="27" fill="#233b49">−1</text><path d="M180,248 L435,248" stroke="#237a63" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="247" y="235" font-size="23" fill="#233b49">GELU</text><rect x="470" y="215" width="135" height="65" rx="8" fill="#d1dced"/><text x="482" y="258" font-size="25" fill="#233b49">−0,159</text></g></svg>